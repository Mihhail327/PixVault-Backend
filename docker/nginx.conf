events {}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # === Раздача изображений ===
    server {
        listen 80;
        server_name _;

        # Раздаём файлы из volume /app/images
        location /images/ {
            alias /app/images/;
            autoindex off;
            access_log off;
        }

        # Проксируем всё остальное на Python-бэкенд
        location / {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}