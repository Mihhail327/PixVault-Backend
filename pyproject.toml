[project]
name = "pixvault-backend"
version = "0.1.0"
description = "Secure image storage and management backend for PixVault."
authors = [
    {name = "Mihhail327"}
]
requires-python = ">=3.13,<4.0"
dependencies = [
    "flask (>=3.1.2,<4.0.0)",
    "flask-sqlalchemy (>=3.1.1,<4.0.0)",
    "flask-migrate (>=4.1.0,<5.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "pillow (>=12.1.0,<13.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "flask-cors (>=6.0.2,<7.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "rich (>=14.2.0,<15.0.0)",
    "sqlalchemy-utils (>=0.42.1,<0.43.0)",
    "gunicorn (>=24.1.1,<25.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
